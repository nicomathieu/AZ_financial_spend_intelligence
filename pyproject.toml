[project]
name = "az-financial-spend-intelligence"
version = "0.1.0"
description = "RAG-powered finance spend intelligence assistant — FastAPI backend + React frontend"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "litellm>=1.98.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
# E/F: pycodestyle + pyflakes; UP: pyupgrade (enforces X|Y unions); I: isort
